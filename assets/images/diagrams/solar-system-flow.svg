<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%" fill="none" class="solar-flow-diagram">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Solar Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- DC Current Line Gradient -->
    <linearGradient id="dcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- AC Current Line Gradient -->
    <linearGradient id="acGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10B981" flood-opacity="0.5" />
    </filter>
    
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>

    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.8" />
    </filter>

    <filter id="arrowGlowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#EF4444" flood-opacity="0.8" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowDC" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arrowAC" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>

    <style>
      @keyframes pulseFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseArrowGlow {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .anim-flow {
        stroke-dasharray: 8 6;
        animation: pulseFlow 1s linear infinite;
      }
      .anim-flow-reverse {
        stroke-dasharray: 6 4;
        animation: pulseFlow 1.2s linear infinite reverse;
      }
      .diagram-node {
        transition: transform 0.25s ease;
      }
      .diagram-node:hover {
        transform: translateY(-4px);
      }
      .flow-arrow-head {
        animation: pulseArrowGlow 1.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1100" height="420" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  
  <!-- Blueprint Tech Grid -->
  <g opacity="0.12">
    <line x1="0" y1="70" x2="1100" y2="70" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="180" x2="1100" y2="180" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="290" x2="1100" y2="290" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="195" y1="0" x2="195" y2="420" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="405" y1="0" x2="405" y2="420" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="635" y1="0" x2="635" y2="420" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="845" y1="0" x2="845" y2="420" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Header Badge Inside Diagram -->
  <g transform="translate(30, 24)">
    <rect width="320" height="32" rx="16" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
    <circle cx="18" cy="16" r="4" fill="#10B981" />
    <text x="32" y="21" fill="#34D399" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">⚡ COMPLETE SYSTEM ENERGY FLOW</text>
  </g>

  <!-- ==================== PROMINENT ARROWS & CONNECTORS ==================== -->

  <!-- ARROW 1: Solar Panels -> DCDB Box -->
  <g>
    <!-- Label Pill Above Arrow -->
    <rect x="202" y="142" width="76" height="20" rx="10" fill="#0B132B" stroke="#F59E0B" stroke-width="1" />
    <text x="240" y="156" fill="#FBBF24" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DC POWER</text>
    
    <!-- Base Solid Background Line -->
    <line x1="195" y1="180" x2="265" y2="180" stroke="#78350F" stroke-width="6" stroke-linecap="round" />
    <!-- Animated Energy Flow -->
    <line x1="195" y1="180" x2="265" y2="180" stroke="url(#dcGrad)" stroke-width="6" stroke-linecap="round" class="anim-flow" />
    <!-- Bold Luminous Arrow Head -->
    <polygon points="280,180 262,170 262,190" fill="#F59E0B" filter="url(#arrowGlowRed)" />
    <!-- Inner Arrow Accent -->
    <polygon points="278,180 264,173 264,187" fill="#FFFFFF" />
  </g>

  <!-- ARROW 2: DCDB Box -> Hybrid Inverter -->
  <g>
    <!-- Label Pill Above Arrow -->
    <rect x="412" y="142" width="76" height="20" rx="10" fill="#0B132B" stroke="#EF4444" stroke-width="1" />
    <text x="450" y="156" fill="#F87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PROTECTED</text>
    
    <!-- Base Solid Background Line -->
    <line x1="405" y1="180" x2="475" y2="180" stroke="#7F1D1D" stroke-width="6" stroke-linecap="round" />
    <!-- Animated Energy Flow -->
    <line x1="405" y1="180" x2="475" y2="180" stroke="url(#dcGrad)" stroke-width="6" stroke-linecap="round" class="anim-flow" />
    <!-- Bold Luminous Arrow Head -->
    <polygon points="490,180 472,170 472,190" fill="#EF4444" filter="url(#arrowGlowRed)" />
    <polygon points="488,180 474,173 474,187" fill="#FFFFFF" />
  </g>

  <!-- ARROW 3: Hybrid Inverter -> ACDB Box -->
  <g>
    <!-- Label Pill Above Arrow -->
    <rect x="642" y="142" width="76" height="20" rx="10" fill="#0B132B" stroke="#10B981" stroke-width="1" />
    <text x="680" y="156" fill="#34D399" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">230V AC</text>
    
    <!-- Base Solid Background Line -->
    <line x1="635" y1="180" x2="705" y2="180" stroke="#064E3B" stroke-width="6" stroke-linecap="round" />
    <!-- Animated Energy Flow -->
    <line x1="635" y1="180" x2="705" y2="180" stroke="url(#acGrad)" stroke-width="6" stroke-linecap="round" class="anim-flow" />
    <!-- Bold Luminous Arrow Head -->
    <polygon points="720,180 702,170 702,190" fill="#10B981" filter="url(#arrowGlow)" />
    <polygon points="718,180 704,173 704,187" fill="#FFFFFF" />
  </g>

  <!-- ARROW 4: ACDB Box -> Home & Grid -->
  <g>
    <!-- Label Pill Above Arrow -->
    <rect x="852" y="142" width="76" height="20" rx="10" fill="#0B132B" stroke="#06B6D4" stroke-width="1" />
    <text x="890" y="156" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">AC LOAD</text>
    
    <!-- Base Solid Background Line -->
    <line x1="845" y1="180" x2="915" y2="180" stroke="#0C4A6E" stroke-width="6" stroke-linecap="round" />
    <!-- Animated Energy Flow -->
    <line x1="845" y1="180" x2="915" y2="180" stroke="url(#acGrad)" stroke-width="6" stroke-linecap="round" class="anim-flow" />
    <!-- Bold Luminous Arrow Head -->
    <polygon points="930,180 912,170 912,190" fill="#06B6D4" filter="url(#arrowGlow)" />
    <polygon points="928,180 914,173 914,187" fill="#FFFFFF" />
  </g>

  <!-- ARROW 5: Inverter <-> Battery Storage (Bidirectional) -->
  <g>
    <!-- Background Pill -->
    <rect x="580" y="278" width="94" height="20" rx="10" fill="#0B132B" stroke="#38BDF8" stroke-width="1" />
    <text x="627" y="292" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">2-WAY BACKUP</text>

    <!-- Vertical Line -->
    <line x1="565" y1="265" x2="565" y2="310" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" class="anim-flow-reverse" />
    <!-- Down Arrow Head -->
    <polygon points="565,316 557,302 573,302" fill="#38BDF8" />
    <!-- Up Arrow Head -->
    <polygon points="565,260 557,274 573,274" fill="#38BDF8" />
  </g>

  <!-- ==================== STAGE 1: SOLAR PV MODULES ==================== -->
  <g transform="translate(65, 95)" class="diagram-node" id="nodeStage1">
    <rect width="130" height="170" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#amberGlow)" />
    <!-- Sun Icon in Corner -->
    <circle cx="108" cy="24" r="12" fill="url(#sunGrad)" />
    <path d="M 108 6 L 108 10 M 108 38 L 108 42 M 90 24 L 94 24 M 122 24 L 126 24" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
    
    <!-- Solar Panels Grid -->
    <g transform="translate(18, 20)">
      <rect x="0" y="0" width="40" height="48" rx="3" fill="#0369A1" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="0" y1="24" x2="40" y2="24" stroke="#7DD3FC" stroke-width="0.8" />
      <line x1="20" y1="0" x2="20" y2="48" stroke="#7DD3FC" stroke-width="0.8" />

      <rect x="46" y="0" width="40" height="48" rx="3" fill="#0369A1" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="46" y1="24" x2="86" y2="24" stroke="#7DD3FC" stroke-width="0.8" />
      <line x1="66" y1="0" x2="66" y2="48" stroke="#7DD3FC" stroke-width="0.8" />

      <rect x="0" y="54" width="40" height="48" rx="3" fill="#0369A1" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="0" y1="78" x2="40" y2="78" stroke="#7DD3FC" stroke-width="0.8" />
      <line x1="20" y1="54" x2="20" y2="102" stroke="#7DD3FC" stroke-width="0.8" />

      <rect x="46" y="54" width="40" height="48" rx="3" fill="#0369A1" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="46" y1="78" x2="86" y2="78" stroke="#7DD3FC" stroke-width="0.8" />
      <line x1="66" y1="54" x2="66" y2="102" stroke="#7DD3FC" stroke-width="0.8" />
    </g>

    <!-- Node Title -->
    <rect x="15" y="132" width="100" height="26" rx="6" fill="#0B132B" />
    <text x="65" y="146" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. SOLAR PV</text>
    <text x="65" y="157" fill="#FBBF24" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Mono PERC Modules</text>
  </g>

  <!-- ==================== STAGE 2: DCDB DISTRIBUTION ==================== -->
  <g transform="translate(285, 95)" class="diagram-node" id="nodeStage2">
    <rect width="120" height="170" rx="14" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="2" />
    
    <!-- Enclosure Inner Box -->
    <rect x="15" y="20" width="90" height="100" rx="6" fill="#0B132B" stroke="#475569" stroke-width="1.2" />
    <!-- DC MCB Fuses -->
    <rect x="25" y="32" width="28" height="45" rx="3" fill="#DC2626" />
    <rect x="67" y="32" width="28" height="45" rx="3" fill="#10B981" />
    <!-- Surge Protector Indicator -->
    <circle cx="39" cy="92" r="5" fill="#EF4444" />
    <circle cx="81" cy="92" r="5" fill="#10B981" />
    <text x="60" y="110" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">DC SPD 1000V</text>

    <!-- Node Title -->
    <rect x="10" y="132" width="100" height="26" rx="6" fill="#0B132B" />
    <text x="60" y="146" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. DCDB BOX</text>
    <text x="60" y="157" fill="#F87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Surge &amp; Fuse Safety</text>
  </g>

  <!-- ==================== STAGE 3: HYBRID INVERTER ==================== -->
  <g transform="translate(495, 80)" class="diagram-node" id="nodeStage3">
    <rect width="140" height="185" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2.5" filter="url(#emeraldGlow)" />
    
    <!-- Digital LCD Screen -->
    <rect x="15" y="18" width="110" height="60" rx="6" fill="#064E3B" stroke="#34D399" stroke-width="1.5" />
    <text x="70" y="36" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DC ➔ AC ACTIVE</text>
    <text x="70" y="52" fill="#FBBF24" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">98.6% MPPT EFF</text>
    <text x="70" y="68" fill="#E2E8F0" font-family="monospace" font-size="8" text-anchor="middle">SOLAR: 4.8 kW</text>

    <!-- Central Waveform Emblem -->
    <circle cx="70" cy="104" r="16" fill="#059669" />
    <path d="M 60 104 Q 65 96 70 104 T 80 104" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Node Title -->
    <rect x="12" y="142" width="116" height="28" rx="6" fill="#064E3B" />
    <text x="70" y="156" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">3. HYBRID INVERTER</text>
    <text x="70" y="167" fill="#34D399" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Pure Sine Wave</text>
  </g>

  <!-- ==================== STAGE 4: ACDB DISTRIBUTION ==================== -->
  <g transform="translate(725, 95)" class="diagram-node" id="nodeStage4">
    <rect width="120" height="170" rx="14" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="2" />
    
    <!-- Enclosure Inner Box -->
    <rect x="15" y="20" width="90" height="100" rx="6" fill="#0B132B" stroke="#475569" stroke-width="1.2" />
    <rect x="25" y="32" width="70" height="25" rx="3" fill="#0284C7" />
    <rect x="25" y="64" width="70" height="25" rx="3" fill="#059669" />
    <text x="60" y="48" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">AC MCB</text>
    <text x="60" y="80" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">AC SPD</text>
    <circle cx="60" cy="104" r="4" fill="#38BDF8" />

    <!-- Node Title -->
    <rect x="10" y="132" width="100" height="26" rx="6" fill="#0B132B" />
    <text x="60" y="146" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4. ACDB BOX</text>
    <text x="60" y="157" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Grid &amp; Load Safety</text>
  </g>

  <!-- ==================== STAGE 5: HOME, APPLIANCES & GRID ==================== -->
  <g transform="translate(935, 95)" class="diagram-node" id="nodeStage5">
    <rect width="130" height="170" rx="14" fill="url(#cardGrad)" stroke="#FBBF24" stroke-width="2" filter="url(#amberGlow)" />
    
    <!-- House & Modern Facility Silhouette -->
    <g transform="translate(25, 20)">
      <!-- House Roof & Base -->
      <path d="M 40 4 L 75 32 L 5 32 Z" fill="#F59E0B" />
      <rect x="15" y="32" width="50" height="42" rx="2" fill="#334155" />
      <rect x="32" y="48" width="16" height="26" rx="1" fill="#FBBF24" />
      <rect x="20" y="38" width="12" height="12" rx="1" fill="#67E8F9" />
      <rect x="48" y="38" width="12" height="12" rx="1" fill="#67E8F9" />

      <!-- Energy Star Badge -->
      <circle cx="68" cy="14" r="10" fill="#10B981" />
      <text x="68" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
    </g>

    <!-- Node Title -->
    <rect x="10" y="132" width="110" height="26" rx="6" fill="#0B132B" />
    <text x="65" y="146" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">5. HOME &amp; GRID</text>
    <text x="65" y="157" fill="#FBBF24" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Zero-Bill Power</text>
  </g>

  <!-- ==================== BOTTOM BATTERY STORAGE UNIT ==================== -->
  <g transform="translate(485, 318)" class="diagram-node">
    <rect width="160" height="82" rx="12" fill="#0B132B" stroke="#38BDF8" stroke-width="2" />
    <!-- Battery Level Indicator Bars -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="124" height="22" rx="4" fill="#1E293B" stroke="#475569" />
      <rect x="4" y="4" width="28" height="14" rx="2" fill="#10B981" />
      <rect x="35" y="4" width="28" height="14" rx="2" fill="#10B981" />
      <rect x="66" y="4" width="28" height="14" rx="2" fill="#10B981" />
      <rect x="97" y="4" width="23" height="14" rx="2" fill="#10B981" />
    </g>
    <text x="80" y="56" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">LiFePO4 &amp; TUBULAR BATTERY</text>
    <text x="80" y="70" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">24/7 Uninterrupted Backup</text>
  </g>
</svg>
