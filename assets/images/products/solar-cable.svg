<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="cableGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="cableGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#F8FAFC" />
  
  <!-- Cable Spool / Dynamic Coils -->
  <g filter="url(#shadow)" transform="translate(40, 30)">
    <!-- Red DC Solar Cable Coil -->
    <ellipse cx="140" cy="180" rx="110" ry="40" fill="none" stroke="url(#cableGrad1)" stroke-width="26" stroke-linecap="round" />
    <ellipse cx="140" cy="150" rx="110" ry="40" fill="none" stroke="url(#cableGrad1)" stroke-width="26" stroke-linecap="round" />
    <ellipse cx="140" cy="120" rx="110" ry="40" fill="none" stroke="url(#cableGrad1)" stroke-width="26" stroke-linecap="round" />

    <!-- Black DC Solar Cable Crossing Loop -->
    <path d="M 60 170 C 40 100, 200 60, 240 120 C 280 180, 180 230, 270 200" fill="none" stroke="url(#cableGrad2)" stroke-width="22" stroke-linecap="round" />
    
    <!-- Cutaway section revealing multi-strand tinned copper core -->
    <g transform="translate(260, 175) rotate(-20)">
      <rect x="0" y="0" width="40" height="22" rx="4" fill="#0F172A" />
      <rect x="25" y="3" width="25" height="16" rx="2" fill="#E2E8F0" />
      <rect x="40" y="5" width="25" height="12" rx="2" fill="url(#copperGrad)" />
      <!-- Copper Strands -->
      <line x1="45" y1="7" x2="65" y2="7" stroke="#FFFBEB" stroke-width="1.5" />
      <line x1="45" y1="11" x2="65" y2="11" stroke="#FFFBEB" stroke-width="1.5" />
      <line x1="45" y1="15" x2="65" y2="15" stroke="#FFFBEB" stroke-width="1.5" />
    </g>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(20, 20)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">1500V DC XLPO</text>
  </g>
</svg>
