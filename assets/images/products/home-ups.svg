<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="upsBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="dispGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="upsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#F8FAFC" />
  
  <g filter="url(#upsShadow)" transform="translate(60, 45)">
    <!-- Main UPS Chassis -->
    <rect x="0" y="0" width="280" height="190" rx="12" fill="url(#upsBody)" stroke="#334155" stroke-width="2" />
    
    <!-- Glossy Front Bezel -->
    <rect x="15" y="15" width="250" height="160" rx="8" fill="#111827" />
    
    <!-- Digital Smart Display -->
    <rect x="40" y="35" width="130" height="65" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1.5" />
    <text x="50" y="55" fill="#34D399" font-family="'Courier New', monospace" font-size="12" font-weight="bold">OUTPUT: 230V</text>
    <text x="50" y="70" fill="#34D399" font-family="'Courier New', monospace" font-size="12" font-weight="bold">LOAD: 48%</text>
    <text x="50" y="85" fill="#FBBF24" font-family="'Courier New', monospace" font-size="11" font-weight="bold">ECO SINE WAVE</text>
    
    <!-- LED Indicators -->
    <g transform="translate(195, 35)">
      <circle cx="10" cy="10" r="5" fill="#10B981" />
      <text x="22" y="13" fill="#94A3B8" font-family="sans-serif" font-size="8">MAINS</text>
      
      <circle cx="10" cy="28" r="5" fill="#3B82F6" />
      <text x="22" y="31" fill="#94A3B8" font-family="sans-serif" font-size="8">UPS ON</text>
      
      <circle cx="10" cy="46" r="5" fill="#F59E0B" />
      <text x="22" y="49" fill="#94A3B8" font-family="sans-serif" font-size="8">CHARGING</text>
    </g>

    <!-- Power Soft Button -->
    <circle cx="230" cy="130" r="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <path d="M 230 120 L 230 128 M 225 125 A 7 7 0 1 0 235 125" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Cooling Vents -->
    <g transform="translate(40, 125)">
      <line x1="0" y1="0" x2="130" y2="0" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="8" x2="130" y2="8" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="16" x2="130" y2="16" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(20, 20)">
    <rect width="160" height="28" rx="14" fill="#059669" />
    <text x="80" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">PURE SINE WAVE UPS</text>
  </g>
</svg>
