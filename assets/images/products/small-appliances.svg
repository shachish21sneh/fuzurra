<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="fanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="fanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#F8FAFC" />
  
  <!-- BLDC Energy Saving Smart Ceiling Fan & Small Appliances -->
  <g filter="url(#fanShadow)" transform="translate(140, 130)">
    <!-- Fan Downrod & Canopy -->
    <rect x="55" y="-90" width="10" height="70" fill="#64748B" />
    <path d="M 45 -90 L 75 -90 L 68 -70 L 52 -70 Z" fill="#334155" />
    <path d="M 48 -20 L 72 -20 L 78 0 L 42 0 Z" fill="#334155" />

    <!-- Fan Blades (Aerodynamic Design) -->
    <!-- Top Blade -->
    <path d="M 60 15 L 75 10 L 175 -50 C 185 -45, 175 -15, 160 -5 L 60 15 Z" fill="url(#bladeGrad)" />
    <!-- Bottom Left Blade -->
    <path d="M 60 15 L 50 25 L -45 80 C -55 75, -45 45, -30 35 L 60 15 Z" fill="url(#bladeGrad)" />
    <!-- Bottom Right Blade -->
    <path d="M 60 15 L 70 25 L 85 135 C 75 145, 45 135, 35 120 L 60 15 Z" fill="url(#bladeGrad)" />

    <!-- Center BLDC Motor Housing -->
    <circle cx="60" cy="15" r="32" fill="url(#fanGrad)" stroke="#F59E0B" stroke-width="2" />
    <circle cx="60" cy="15" r="22" fill="#0F172A" />
    <!-- LED Glow ring -->
    <circle cx="60" cy="15" r="10" fill="#38BDF8" fill-opacity="0.8" />
    <circle cx="60" cy="15" r="4" fill="#FFFFFF" />

    <!-- Remote controller beside fan -->
    <g transform="translate(140, 30) rotate(-15)">
      <rect width="28" height="65" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <circle cx="14" cy="14" r="5" fill="#EF4444" />
      <rect x="7" y="24" width="14" height="4" rx="2" fill="#94A3B8" />
      <rect x="7" y="32" width="14" height="4" rx="2" fill="#94A3B8" />
      <rect x="7" y="40" width="14" height="4" rx="2" fill="#94A3B8" />
      <circle cx="14" cy="52" r="3" fill="#10B981" />
    </g>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(20, 20)">
    <rect width="180" height="28" rx="14" fill="#059669" />
    <text x="90" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">BLDC 65% ENERGY SAVER</text>
  </g>
</svg>
