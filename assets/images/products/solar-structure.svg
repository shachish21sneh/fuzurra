<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="alumiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="clampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="structShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#F8FAFC" />
  
  <g filter="url(#structShadow)" transform="translate(40, 40)">
    <!-- Slanted Solar Mounting Rail -->
    <path d="M 40 180 L 260 60 L 280 75 L 60 195 Z" fill="url(#alumiGrad)" stroke="#475569" stroke-width="1.5" />
    <path d="M 60 195 L 280 75 L 280 95 L 60 215 Z" fill="#64748B" />
    
    <!-- Heavy Duty Leg Support / Strut -->
    <path d="M 80 160 L 80 230 L 100 230 L 100 150 Z" fill="url(#alumiGrad)" stroke="#475569" stroke-width="1" />
    <polygon points="60,230 120,230 110,240 70,240" fill="#334155" /> <!-- Base Plate -->
    
    <path d="M 230 80 L 230 210 L 250 210 L 250 70 Z" fill="url(#alumiGrad)" stroke="#475569" stroke-width="1" />
    <polygon points="210,210 270,210 260,220 220,220" fill="#334155" /> <!-- Base Plate 2 -->

    <!-- Diagonal cross brace -->
    <line x1="90" y1="210" x2="240" y2="100" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" />

    <!-- Detailed Aluminum Mid Clamp Component Showcase -->
    <g transform="translate(190, 140)">
      <rect width="50" height="35" rx="4" fill="url(#clampGrad)" stroke="#334155" stroke-width="1.5" />
      <polygon points="10,0 25,-12 40,0" fill="#94A3B8" stroke="#334155" stroke-width="1" />
      <!-- Allen Bolt -->
      <circle cx="25" cy="18" r="8" fill="#1E293B" />
      <polygon points="25,13 29,15 29,20 25,22 21,20 21,15" fill="#94A3B8" />
      <text x="25" y="48" fill="#0F172A" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">MID CLAMP</text>
    </g>

    <!-- Detailed End Clamp -->
    <g transform="translate(40, 90)">
      <path d="M 0 0 L 35 0 L 35 30 L 15 30 L 15 15 L 0 15 Z" fill="url(#clampGrad)" stroke="#334155" stroke-width="1.5" />
      <!-- Bolt -->
      <circle cx="25" cy="15" r="6" fill="#1E293B" />
      <text x="20" y="45" fill="#0F172A" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">END CLAMP</text>
    </g>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(20, 20)">
    <rect width="170" height="28" rx="14" fill="#0284C7" />
    <text x="85" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">HDG AL6005-T5 STRUCTURE</text>
  </g>
</svg>
