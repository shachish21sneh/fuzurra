      FUZURRA
    </text>
    <text x="0" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="4" fill="#34D399">
      INDUSTRIES PVT. LTD.
    </text>
    <circle cx="160" cy="20" r="3.5" fill="#FBBF24" />
